[package]
name = "ramforge-update"
description = "RAMForge update check: signed manifest, verified download, self-replace"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# egui update dialog shared by RAMForge.exe and RAMForge-USB.exe
ui = ["dep:egui"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
ureq = { version = "3", features = ["platform-verifier"] }
ed25519-dalek = { version = "3", default-features = false, features = ["fast"] }
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.3"
egui = { version = "0.37", default-features = false, optional = true }
