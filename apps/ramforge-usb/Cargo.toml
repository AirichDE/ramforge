[package]
name = "ramforge-usb"
description = "RAMForge-USB – bereitet USB-Sticks mit der RAMForge-Boot-Variante vor und aktualisiert sie"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "RAMForge-USB"
path = "src/main.rs"

[dependencies]
ramforge-update = { path = "../../crates/update", features = ["ui"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
