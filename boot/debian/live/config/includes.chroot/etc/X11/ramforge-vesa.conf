# RAMForge: last X fallback when booted in legacy BIOS/CSM mode (VESA BIOS
# modes). Never used on UEFI, where there is no VESA BIOS.
Section "Device"
    Identifier "VESA"
    Driver     "vesa"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device     "VESA"
EndSection

Section "ServerFlags"
    Option "AutoAddGPU" "false"
EndSection
