# RAMForge: X server on the firmware framebuffer, used only when the kernel
# has no graphics driver for this GPU (see ramforge-session).
Section "Device"
    Identifier "Framebuffer"
    Driver     "fbdev"
    # Deliberately not a PCI address: X then skips its PCI probe (which cannot
    # find efifb and leaves a dead screen behind) and opens /dev/fb0 directly.
    BusID      "fb:0"
    Option     "fbdev" "/dev/fb0"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device     "Framebuffer"
EndSection

Section "ServerFlags"
    Option "AutoAddGPU" "false"
EndSection
