[workspace]
resolver = "2"
members = ["crates/core", "crates/hw", "apps/ramforge", "crates/update", "apps/ramforge-usb", "tools/ramforge-sign", "crates/gpu", "apps/ramforge-gpu"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/airichde/ramforge"
authors = ["Daniel Airich", "RAMForge contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true

# Tests on memory must stay fast even in debug builds.
[profile.dev.package.ramforge-core]
opt-level = 3
