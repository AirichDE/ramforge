[package]
name = "ramforge-sign"
description = "Offline signing tool for RAMForge update manifests (keeps keys outside the repository)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
ramforge-update = { path = "../../crates/update" }
ed25519-dalek = { version = "3", features = ["pkcs8", "pem"] }
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.3"
pkcs8 = { version = "0.11", features = ["encryption", "pem", "std", "getrandom"] }
rpassword = "7.5.5"
zeroize = "1.9.2"
